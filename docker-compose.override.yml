services:
  webapp:
    ports:
      - "127.0.0.1:${WEBAPP_PORT}:8080"

  webapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=${WEBAPI_HTTP_PORT}
    ports:
      - "127.0.0.1:${WEBAPI_HTTP_PORT}:${WEBAPI_HTTP_PORT}"

  worker:
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT}:8080"

  workflow-functions:
    ports:
      - "127.0.0.1:${WORKFLOW_HTTP_PORT}:80"

  workflow-monitor:
    # Administrative UI with local authentication disabled: never bind this port beyond loopback.
    ports:
      - "127.0.0.1:${WORKFLOW_MONITOR_PORT}:80"

  workflow-storage:
    ports:
      - "127.0.0.1:${WORKFLOW_BLOB_PORT}:10000"
      - "127.0.0.1:${WORKFLOW_QUEUE_PORT}:10001"
      - "127.0.0.1:${WORKFLOW_TABLE_PORT}:10002"

  azurite:
    ports:
      - "127.0.0.1:${AZURITE_BLOB_PORT}:10000"

  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

  elasticsearch:
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT}:9200"

  kibana:
    ports:
      - "127.0.0.1:${KIBANA_PORT}:5601"

  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

  redis-insight:
    # Administrative UI without authentication: published on loopback only.
    ports:
      - 127.0.0.1:${REDIS_INSIGHT_PORT}:5540
