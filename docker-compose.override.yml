services:
  webapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production      
      - ASPNETCORE_HTTP_PORTS=${WEBAPI_HTTP_PORT}
      - ASPNETCORE_HTTPS_PORTS=${WEBAPI_HTTPS_PORT}
    ports:
      - ${WEBAPI_HTTP_PORT}:${WEBAPI_HTTP_PORT}
      - ${WEBAPI_HTTPS_PORT}:${WEBAPI_HTTPS_PORT}
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/https:ro

  db:
    ports:
      - "${POSTGRES_PORT}:5432"

  elasticsearch:
    ports:
      - ${ELASTICSEARCH_PORT}:9200

  kibana:
    ports:
      - ${KIBANA_PORT}:5601

  rabbitmq:
    ports:
      - ${RABBITMQ_PORT}:5672
      - ${RABBITMQ_MANAGEMENT_PORT}:15672

  redis:
    ports:
      - ${REDIS_PORT}:6379

  redis-insight:
    # Administrative UI without authentication: published on loopback only.
    ports:
      - 127.0.0.1:${REDIS_INSIGHT_PORT}:5540
