# Phase 16 PostgreSQL rollback overlay. It selects the Phase 14 PostgreSQL 16.11 artifact instead of 16.15:
#   docker compose -f docker-compose.yml [-f docker-compose.override.yml] -f docker-compose.postgres-rollback.yml up -d
# Minor releases of one major share the on-disk format, so 16.11 may reopen a postgres-data volume that 16.15 used
# (rehearsed in docs/refactoring/phase-16-report.md). Never use this overlay, or any 16.x image, with a data directory
# written or upgraded by PostgreSQL 17/18; roll back from a newer major only by restoring a verified 16.x backup.
services:
  db:
    image: postgres:16.11@sha256:056b54f00419b49289227ab12d09df508543883f407fe9935a2cec430ef8aa8d
