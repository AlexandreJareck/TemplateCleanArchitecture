# Phase 33 (NFR-SEC-5): security headers of the SPA host. Included by the server and by every location that sets
# its own add_header, because nginx does not inherit add_header into such locations.
# script-src has no 'unsafe-eval' and no inline script (critical-CSS inlining is disabled in angular.json); styles keep
# 'unsafe-inline' because Angular injects component styles at runtime. API calls are same-origin through /api.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
