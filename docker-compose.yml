services:
  webapi:
    build:
      context: .
      dockerfile: Src/Presentation/Template.WebApi/Dockerfile
    container_name: my_dotnet_app
    # Startup order (Phase 14): migrations and seeds run at WebApi startup, so it waits until both PostgreSQL
    # databases accept queries. Elasticsearch and RabbitMQ keep their pre-Phase 14 health conditions; Redis stays
    # optional (the cache misses when Redis is down), so it is not a startup prerequisite.
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB_NAME};SearchPath=public
      - ConnectionStrings__IdentityConnection=Host=db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_IDENTITY_DB_NAME};SearchPath=public
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetcore.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_CERTIFICATE_PASSWORD}
      - ConnectionStrings__RedisConnection=redis:6379,password=${REDIS_PASSWORD}
      - RabbitMqSettings__HostName=rabbitmq
      - RabbitMqSettings__Port=5672
      - RabbitMqSettings__UserName=${RABBITMQ_DEFAULT_USER}
      - RabbitMqSettings__Password=${RABBITMQ_DEFAULT_PASS}
    networks:
      - nw

  db:
    # PostgreSQL 16.11, the artifact `postgres:16` resolved to before Phase 14. Patching within 16 belongs to Phase 16.
    image: postgres:16.11@sha256:056b54f00419b49289227ab12d09df508543883f407fe9935a2cec430ef8aa8d
    container_name: my_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME}
      POSTGRES_IDENTITY_DB_NAME: ${POSTGRES_IDENTITY_DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - nw
    # Ready only when both databases created by init-db.sh accept a read-only query over TCP. The temporary
    # server used during initialization listens on the Unix socket only, so the probe cannot pass early.
    # Loopback connections use the image's trust rule, so no password is passed.
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB_NAME\" -tAc 'SELECT 1' >/dev/null && psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_IDENTITY_DB_NAME\" -tAc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  elasticsearch:
    container_name: elasticsearch
    # Elasticsearch 9.x on its own volume. Never mount v01 here: it holds 8.17.4 data that a 9.x node must not open,
    # and an upgraded volume cannot be reopened by 8.x. Move data only through snapshot/restore
    # (docs/refactoring/phase-11-report.md); v01 stays untouched for rollback to the 8.17.4 image.
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5@sha256:13b4a40bb095774f5fda635e45fd5677cc6a26565e42b24997b0c72b88e75984
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - es9-data:/usr/share/elasticsearch/data
    networks:
      - nw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:9.5.5@sha256:13b72ce7222c36e4213229004ae62a87aeb32fd372ebfa6fb38f7a3285fdbb78
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

  rabbitmq:
    container_name: rabbitmq
    # RabbitMQ 4.2.2, the artifact `rabbitmq:latest` resolved to before Phase 14. Broker upgrades belong to Phase 17.
    image: rabbitmq:4.2.2@sha256:18cc2597e9b07bc29f5f991ca2836555245b4f94563773c19b662944f4b6d870
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    networks:
      - nw
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    # Phase 15: one Redis 8 server with the integrated Query Engine (Search), Time Series, JSON and probabilistic
    # capabilities, replacing the separate Search and Time Series module services; RedisGraph was removed (EOL, no
    # consumer). It uses the new redis8-data volume. Never mount redis-volume-data here: it holds the Redis 8.4.0
    # source data kept for rollback (docker-compose.redis-rollback.yml). Move data only through an RDB copy or
    # MIGRATE COPY (docs/refactoring/phase-15-report.md).
    image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    container_name: redis
    restart: always
    networks:
      - nw
    volumes:
      - redis8-data:/data
    # Persistence policy: RDB snapshots with the Redis defaults made explicit, no AOF, no eviction (the cache sets
    # its own TTLs). Authentication: the default user with requirepass.
    command:
      - --requirepass ${REDIS_PASSWORD}
      - --save 3600 1 300 100 60 10000
      - --appendonly no
      - --maxmemory-policy noeviction
    # A reply (PONG or NOAUTH) proves the server is up without passing the password to the probe.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-insight:
    # Redis Insight 1.14.0 (EOL line); its upgrade belongs to Phase 18. It targets the single redis service.
    image: redislabs/redisinsight:1.14.0@sha256:b03ab1426d0d861b0370e05ee670a8819c8ab36b987ca59e4a3e92e0038d089c
    container_name: redis-insight
    restart: always
    depends_on:
      - redis
    networks:
      - nw
    volumes:
      - redis-insight-volume_data:/db

volumes:
  postgres-data:
  # Elasticsearch 8.17.4 data: no longer mounted, kept for rollback and as the snapshot source of a migration.
  v01:
  es9-data:
  rabbitmq-lib:
  rabbitmq-log:
  # Redis 8.4.0 source data: no longer mounted by default, kept for rollback (docker-compose.redis-rollback.yml).
  redis-volume-data:
  redis8-data:
  redis-insight-volume_data:

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

networks:
  nw:
