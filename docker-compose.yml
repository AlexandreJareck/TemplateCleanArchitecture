services:
  worker:
    build:
      context: .
      dockerfile: Src/Workers/Template.Worker/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB_NAME};SearchPath=public
      - RabbitMqSettings__HostName=rabbitmq
      - RabbitMqSettings__Port=5672
      - RabbitMqSettings__UserName=${RABBITMQ_DEFAULT_USER}
      - RabbitMqSettings__Password=${RABBITMQ_DEFAULT_PASS}
      # Phase 30: report outputs go to the private Azurite container; the account key comes from the git-ignored .env.
      - FileStorageSettings__Enabled=true
      - ConnectionStrings__BlobStorage=DefaultEndpointsProtocol=http;AccountName=${AZURITE_ACCOUNT_NAME};AccountKey=${AZURITE_ACCOUNT_KEY};BlobEndpoint=http://azurite:10000/${AZURITE_ACCOUNT_NAME};
    networks:
      - nw
    healthcheck:
      test: ["CMD", "dotnet", "Template.Worker.dll", "--health-probe", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  webapi:
    build:
      context: .
      dockerfile: Src/Presentation/Template.WebApi/Dockerfile
    container_name: my_dotnet_app
    # Startup order (Phase 14): migrations and seeds run at WebApi startup, so it waits until both PostgreSQL
    # databases accept queries. Elasticsearch and RabbitMQ keep their pre-Phase 14 health conditions; Redis stays
    # optional (the cache misses when Redis is down), so it is not a startup prerequisite.
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB_NAME};SearchPath=public
      - ConnectionStrings__IdentityConnection=Host=db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_IDENTITY_DB_NAME};SearchPath=public
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetcore.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_CERTIFICATE_PASSWORD}
      - ConnectionStrings__RedisConnection=redis:6379,password=${REDIS_PASSWORD}
      - RabbitMqSettings__HostName=rabbitmq
      - RabbitMqSettings__Port=5672
      # Phase 22: the JWT signing key is never committed; it comes from the git-ignored .env (see .env.example).
      - JwtSettings__Key=${JwtSettings__Key}
      - RabbitMqSettings__UserName=${RABBITMQ_DEFAULT_USER}
      - RabbitMqSettings__Password=${RABBITMQ_DEFAULT_PASS}
      # Phase 30: report downloads stream from the private Azurite container (optional dependency, readiness Degraded).
      - FileStorageSettings__Enabled=true
      - ConnectionStrings__BlobStorage=DefaultEndpointsProtocol=http;AccountName=${AZURITE_ACCOUNT_NAME};AccountKey=${AZURITE_ACCOUNT_KEY};BlobEndpoint=http://azurite:10000/${AZURITE_ACCOUNT_NAME};
    networks:
      - nw

  azurite:
    # Phase 30 (D23-7, ADR-0004): Azurite 3.37.0 blob service only, on its own azurite-data volume, with one account
    # whose name and key come from the git-ignored .env (never the published development account). The container holding
    # report outputs is private; nothing publishes the blob port. Azure Blob Storage in Azure is never provisioned here.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    restart: always
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data", "--skipApiVersionCheck"]
    environment:
      AZURITE_ACCOUNTS: ${AZURITE_ACCOUNT_NAME}:${AZURITE_ACCOUNT_KEY}
    volumes:
      - azurite-data:/data
    networks:
      - nw
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db:
    # PostgreSQL 16.15 (Phase 16 minor update; same on-disk format as the Phase 14 pin 16.11, no dump/restore needed).
    # Rollback to 16.11: docker-compose.postgres-rollback.yml. PostgreSQL 18 is a separate, not yet authorized migration.
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    container_name: my_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME}
      POSTGRES_IDENTITY_DB_NAME: ${POSTGRES_IDENTITY_DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - nw
    # Ready only when both databases created by init-db.sh accept a read-only query over TCP. The temporary
    # server used during initialization listens on the Unix socket only, so the probe cannot pass early.
    # Loopback connections use the image's trust rule, so no password is passed.
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB_NAME\" -tAc 'SELECT 1' >/dev/null && psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_IDENTITY_DB_NAME\" -tAc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  elasticsearch:
    container_name: elasticsearch
    # Elasticsearch 9.x on its own volume. Never mount v01 here: it holds 8.17.4 data that a 9.x node must not open,
    # and an upgraded volume cannot be reopened by 8.x. Move data only through snapshot/restore
    # (docs/refactoring/phase-11-report.md); v01 stays untouched for rollback to the 8.17.4 image.
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5@sha256:13b4a40bb095774f5fda635e45fd5677cc6a26565e42b24997b0c72b88e75984
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - es9-data:/usr/share/elasticsearch/data
    networks:
      - nw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:9.5.5@sha256:13b72ce7222c36e4213229004ae62a87aeb32fd372ebfa6fb38f7a3285fdbb78
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

  rabbitmq:
    container_name: rabbitmq
    # Phase 17: RabbitMQ 4.3.6 (Erlang/OTP 27.3.4.18) management image on new volumes. 4.3 is reachable only from the
    # latest 4.2 patch with every stable feature flag (including khepri_db) enabled, and feature flags cannot be
    # disabled, so never mount rabbitmq-lib here: it holds the pre-Phase 17 4.2.2 data kept for rollback
    # (docker-compose.rabbitmq-rollback.yml). Move data only through the rehearsed sequence on a copy
    # (docs/refactoring/phase-17-report.md). Only the management plugin is enabled (rabbitmq-plugins config).
    image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
    # The data directory belongs to the node name rabbit@<hostname>. Without a fixed hostname every recreated container
    # (an image change, for example) starts a new, empty node and leaves the previous durable state unused.
    hostname: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq4-data:/var/lib/rabbitmq/
      - rabbitmq4-log:/var/log/rabbitmq
    networks:
      - nw
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    # Phase 15: one Redis 8 server with the integrated Query Engine (Search), Time Series, JSON and probabilistic
    # capabilities, replacing the separate Search and Time Series module services; RedisGraph was removed (EOL, no
    # consumer). It uses the new redis8-data volume. Never mount redis-volume-data here: it holds the Redis 8.4.0
    # source data kept for rollback (docker-compose.redis-rollback.yml). Move data only through an RDB copy or
    # MIGRATE COPY (docs/refactoring/phase-15-report.md).
    image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    container_name: redis
    restart: always
    networks:
      - nw
    volumes:
      - redis8-data:/data
    # Persistence policy: RDB snapshots with the Redis defaults made explicit, no AOF, no eviction (the cache sets
    # its own TTLs). Authentication: the default user with requirepass.
    command:
      - --requirepass ${REDIS_PASSWORD}
      - --save 3600 1 300 100 60 10000
      - --appendonly no
      - --maxmemory-policy noeviction
    # A reply (PONG or NOAUTH) proves the server is up without passing the password to the probe.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-insight:
    # Phase 18: Redis Insight 3.8.0 (official redis/redisinsight image, user node uid 1000, port 5540, state in /data)
    # as disposable local tooling. Nothing depends on it: WebApi, Redis and the release gate start and pass without it.
    # It uses the new redis-insight-data volume. Never mount redis-insight-volume_data here: it holds the Redis Insight
    # 1.14 state (/db, different format) kept for rollback (docker-compose.redis-insight-rollback.yml).
    image: redis/redisinsight:3.8.0@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84
    container_name: redis-insight
    restart: always
    depends_on:
      - redis
    # The single Redis 8 connection is recreated from these values at every start (it appears after the EULA is
    # accepted in the UI; nothing accepts it automatically). The password comes from .env at runtime and is stored
    # encrypted with REDIS_INSIGHT_ENCRYPTION_KEY; without that key Redis Insight stores it unencrypted in its volume.
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: template-redis8
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD}
      RI_ENCRYPTION_KEY: ${REDIS_INSIGHT_ENCRYPTION_KEY:-}
    networks:
      - nw
    volumes:
      - redis-insight-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5540/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  # Elasticsearch 8.17.4 data: no longer mounted, kept for rollback and as the snapshot source of a migration.
  v01:
  es9-data:
  # RabbitMQ 4.2.2 source data and logs: no longer mounted by default, kept for rollback (docker-compose.rabbitmq-rollback.yml).
  rabbitmq-lib:
  rabbitmq-log:
  rabbitmq4-data:
  rabbitmq4-log:
  # Redis 8.4.0 source data: no longer mounted by default, kept for rollback (docker-compose.redis-rollback.yml).
  redis-volume-data:
  redis8-data:
  # Redis Insight 1.14 state: no longer mounted by default, kept for rollback (docker-compose.redis-insight-rollback.yml).
  redis-insight-volume_data:
  redis-insight-data:
  # Phase 30: Azurite blob data (report outputs); report metadata lives in PostgreSQL.
  azurite-data:

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

networks:
  nw:
