services:
  webapi:
    build:
      context: .
      dockerfile: Src/Presentation/Template.WebApi/Dockerfile
    container_name: my_dotnet_app
    depends_on:
      elasticsearch:
        condition: service_healthy
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB_NAME};SearchPath=public
      - ConnectionStrings__IdentityConnection=Host=db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_IDENTITY_DB_NAME};SearchPath=public
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetcore.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_CERTIFICATE_PASSWORD}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=${RABBITMQ_PORT}
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
    networks:
      - nw

  db:
    image: postgres:16
    container_name: my_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME}
      POSTGRES_IDENTITY_DB_NAME: ${POSTGRES_IDENTITY_DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - nw

  elasticsearch:
    container_name: elasticsearch
    # Elasticsearch 9.x on its own volume. Never mount v01 here: it holds 8.17.4 data that a 9.x node must not open,
    # and an upgraded volume cannot be reopened by 8.x. Move data only through snapshot/restore
    # (docs/refactoring/phase-11-report.md); v01 stays untouched for rollback to the 8.17.4 image.
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5@sha256:13b4a40bb095774f5fda635e45fd5677cc6a26565e42b24997b0c72b88e75984
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - es9-data:/usr/share/elasticsearch/data
    networks:
      - nw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://elasticsearch:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:9.5.5@sha256:13b72ce7222c36e4213229004ae62a87aeb32fd372ebfa6fb38f7a3285fdbb78
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nw

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:latest
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    networks:
      - nw
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    networks:
      - nw
    volumes:
      - redis-volume-data:/data
    command:
      - --requirepass ${REDIS_PASSWORD}

  redis-insight:
    image: redislabs/redisinsight:1.14.0
    container_name: redis-insight
    restart: always
    depends_on:
      - redis
      - redis-graph
      - redis-search
      - redis-timeseries
    networks:
      - nw
    volumes:
      - redis-insight-volume_data:/db

  redis-graph:
    image: redislabs/redisgraph
    restart: always
    networks:
      - nw

  redis-search:
    image: redislabs/redisearch:latest
    restart: always
    networks:
      - nw

  redis-timeseries:
    image: redislabs/redistimeseries
    restart: always
    networks:
      - nw

volumes:
  postgres-data:
  # Elasticsearch 8.17.4 data: no longer mounted, kept for rollback and as the snapshot source of a migration.
  v01:
  es9-data:
  rabbitmq-lib:
  rabbitmq-log:
  redis-volume-data:
  redis-insight-volume_data:

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

networks:
  nw:
